name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  laravel-docker:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: laravel
          MYSQL_USER: laravel
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - uses: actions/checkout@v3

    # Устанавливаем Docker
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Кэшируем Docker layers для ускорения сборки
    - name: Cache Docker layers
      uses: actions/cache@v3
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-docker-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-docker-

    # Собираем контейнеры
    - name: Build Docker Compose
      run: docker-compose -f docker-compose.yml build

    # Запускаем контейнеры в фоне
    - name: Run Docker Compose
      run: docker-compose -f docker-compose.yml up -d

    # Устанавливаем зависимости Laravel
    - name: Install PHP dependencies
      run: docker-compose run --rm app composer install --no-progress --no-interaction

    # Запускаем тесты
    - name: Run tests
      run: docker-compose run --rm app php artisan test

    # Проверяем код линтером (если есть)
    - name: Code style check
      run: docker-compose run --rm app vendor/bin/php-cs-fixer fix --dry-run --diff
